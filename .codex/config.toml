# ============================================================
# Supervised coding permissions
# ============================================================

[permissions.supervised-coding]
description = "Supervised VS Code development with workspace writes and protected credentials."
extends = ":workspace"


# ------------------------------------------------------------
# Files outside the workspace
# ------------------------------------------------------------

[permissions.supervised-coding.filesystem]

# Git-over-SSH support:
# ssh may read config/known_hosts and use ssh-agent.
"~/.ssh" = "read"

# But private key material is inaccessible.
"~/.ssh/id_rsa" = "deny"
"~/.ssh/id_ed25519" = "deny"
"~/.ssh/id_ecdsa" = "deny"
"~/.ssh/id_dsa" = "deny"
"~/.ssh/*.pem" = "deny"
"~/.ssh/*.key" = "deny"

# Normal Git configuration may be read.
"~/.gitconfig" = "read"
"~/.config/git" = "read"

# Cloud / infrastructure credentials.
"~/.aws" = "deny"
"~/.kube" = "deny"
"~/.azure" = "deny"
"~/.config/gcloud" = "deny"

# Registry / package credentials.
"~/.npmrc" = "deny"
"~/.pypirc" = "deny"
"~/.gnupg" = "deny"
"~/.docker/config.json" = "deny"
"~/.m2/settings.xml" = "deny"
"~/.lein/credentials.clj.gpg" = "deny"
"~/.netrc" = "deny"
"~/.git-credentials" = "deny"
"~/.databrickscfg" = "deny"

# Other AI-agent credentials/state.
"~/.claude.json" = "deny"
"~/.claude/.credentials.json" = "deny"

# Do not expose Codex's own stored auth file to commands.
"~/.codex/auth.json" = "deny"


# ------------------------------------------------------------
# Current VS Code workspace
# ------------------------------------------------------------

[permissions.supervised-coding.filesystem.":workspace_roots"]

# Normal source files remain writable through the inherited
# :workspace profile.

# Secrets are unreadable even though the project is writable.
"**/.env" = "deny"
"**/.env.local" = "deny"
"**/.env.*.local" = "deny"
"**/.env.development" = "deny"
"**/.env.test" = "deny"
"**/.env.production" = "deny"
"**/.env.staging" = "deny"
"**/.envrc" = "deny"
"**/secrets/**" = "deny"

# CI/CD is important enough to require an approval/escalation
# rather than autonomous modification.
".github/workflows" = "read"
".github/actions" = "read"


# ------------------------------------------------------------
# Command network access
# ------------------------------------------------------------

[permissions.supervised-coding.network]
enabled = false

